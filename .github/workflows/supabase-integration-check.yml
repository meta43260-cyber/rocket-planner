name: Python and frontend syntax checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/supabase-rocket-database]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python modules
        run: python -m compileall -q main.py supabase_api.py rocket_planner.py booster.py
      - name: Check browser JavaScript
        run: node --check static/app.js && node --check static/admin.js
