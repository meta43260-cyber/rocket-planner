name: Rocket Planner tests

on:
  push:
    branches: [main, web-app-v2-full-features]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q main.py rocket_planner.py booster.py
      - name: Run unit tests
        run: pytest -q
